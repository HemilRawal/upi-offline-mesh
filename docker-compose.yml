version: '3.8'

services:
  upi-mesh:
    build: .
    container_name: upi-offline-mesh
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:upimesh
      - SPRING_H2_CONSOLE_ENABLED=true
      - LOGGING_LEVEL_COM_DEMO_UPIMESH=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/accounts || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
